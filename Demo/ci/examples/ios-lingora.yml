# 复制到业务仓库 .github/workflows/，按 README 调整工程路径和资源归属。
name: iOS translations and build
on:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: lingora-ios-production
  cancel-in-progress: false
defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      LINGORA_CONFIG: ci/lingora.production.json
      APP_OUTPUT: LingoraDemo/Generated
      COMMON_OUTPUT: LingoraCommon/Generated
      XCODE_PROJECT: LingoraDemo.xcodeproj
      XCODE_SCHEME: LingoraDemo
      LINGORA_CONTENT_DELIVERY_URL: ${{ vars.LINGORA_CONTENT_DELIVERY_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'
      - uses: astral-sh/setup-uv@v6
      - name: Check inputs and pinned CLI
        env:
          LINGORA_API_KEY: ${{ secrets.LINGORA_API_KEY }}
        run: |
          : "${LINGORA_API_KEY:?Missing LINGORA_API_KEY}"
          [[ -n "${LINGORA_CONTENT_DELIVERY_URL//[[:space:]]/}" ]]
          test -f "$LINGORA_CONFIG"
          version="$(tr -d '\r\n' < lingora-cli.version)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(rc[0-9]+)?$ ]]
          uv tool install --python 3.12 "lingora-cli==$version"
          echo "$(uv tool dir --bin)" >> "$GITHUB_PATH"
      - name: Reject outdated source before writing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest_sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_REF_NAME" --jq .sha)"
          [[ "$latest_sha" == "$GITHUB_SHA" ]] || { echo 'Outdated source; run the latest commit.'; exit 1; }
      - name: Validate, push, pull and validate both namespaces
        env:
          LINGORA_API_KEY: ${{ secrets.LINGORA_API_KEY }}
        run: |
          lingora --config "$LINGORA_CONFIG" validate --namespaces app --path "$APP_OUTPUT"
          lingora --config "$LINGORA_CONFIG" validate --namespaces common --path "$COMMON_OUTPUT"
          lingora --config "$LINGORA_CONFIG" push
          lingora --config "$LINGORA_CONFIG" pull --namespaces app --path "$APP_OUTPUT"
          lingora --config "$LINGORA_CONFIG" pull --namespaces common --path "$COMMON_OUTPUT"
          lingora --config "$LINGORA_CONFIG" validate --namespaces app --path "$APP_OUTPUT"
          lingora --config "$LINGORA_CONFIG" validate --namespaces common --path "$COMMON_OUTPUT"
          python3 ci/check_resources.py --config "$LINGORA_CONFIG" \
            --app-output "$APP_OUTPUT" --common-output "$COMMON_OUTPUT"
      - name: Resolve committed package versions and build
        run: |
          xcodebuild -resolvePackageDependencies -project "$XCODE_PROJECT" -scheme "$XCODE_SCHEME" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/Packages" -onlyUsePackageVersionsFromResolvedFile
          xcodebuild -project "$XCODE_PROJECT" -scheme "$XCODE_SCHEME" -configuration Debug \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/Packages" -disableAutomaticPackageResolution \
            "LINGORA_CONTENT_DELIVERY_URL=$LINGORA_CONTENT_DELIVERY_URL" CODE_SIGNING_ALLOWED=NO build
          app="$RUNNER_TEMP/DerivedData/Build/Products/Debug-iphonesimulator/$XCODE_SCHEME.app"
          python3 ci/check_resources.py --config "$LINGORA_CONFIG" \
            --app-output "$APP_OUTPUT" --common-output "$COMMON_OUTPUT" --app-bundle "$app"
          ditto -c -k --sequesterRsrc --keepParent "$app" "$RUNNER_TEMP/ios-simulator.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-${{ github.sha }}
          path: ${{ runner.temp }}/ios-simulator.zip
          if-no-files-found: error
          retention-days: 7
