# 复制到业务仓库 .github/workflows/，按 README 调整工程路径和资源归属。
name: iOS translations and build
on:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: lingora-ios-production
  cancel-in-progress: false
defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      LINGORA_CONFIG: ci/lingora.production.json
      LINGORA_RESOURCES: ci/ios-resources.json
      APP_PRODUCT: LingoraDemo.app
      XCODE_PROJECT: LingoraDemo.xcodeproj
      XCODE_SCHEME: LingoraDemo
      LINGORA_CONTENT_DELIVERY_URL: ${{ vars.LINGORA_CONTENT_DELIVERY_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'
      - name: Check public URL and resolve locked SDK before remote writes
        run: |
          python3 - <<'PYTHON'
          import os
          from urllib.parse import urlsplit
          value = os.environ["LINGORA_CONTENT_DELIVERY_URL"]
          url = urlsplit(value)
          if (url.scheme not in ("http", "https") or not url.hostname
              or url.username or url.password or url.query or url.fragment
              or any(c in value for c in "\r\n$")):
              raise SystemExit("Delivery URL must be public HTTP(S) without query or credentials")
          PYTHON
          xcodebuild -resolvePackageDependencies -project "$XCODE_PROJECT" -scheme "$XCODE_SCHEME" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/Packages" -onlyUsePackageVersionsFromResolvedFile
      - name: Reject outdated source before writing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest_sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_REF_NAME" --jq .sha)"
          [[ "$latest_sha" == "$GITHUB_SHA" ]] || { echo 'Outdated source; run the latest commit.'; exit 1; }
      # 使用包含该 Action 的已审阅开发仓库 commit SHA；SDK package-only Tag 不含 Action。
      - name: Sync configured namespaces
        uses: hzh137940556/lingora-iOS-sdk/.github/actions/ios-translations@REPLACE_WITH_REVIEWED_COMMIT_SHA
        with:
          config: ${{ env.LINGORA_CONFIG }}
          resources: ${{ env.LINGORA_RESOURCES }}
        env:
          LINGORA_API_KEY: ${{ secrets.LINGORA_API_KEY }}
      - name: Build committed package versions
        run: |
          xcodebuild -project "$XCODE_PROJECT" -scheme "$XCODE_SCHEME" -configuration Debug \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/Packages" -disableAutomaticPackageResolution \
            "LINGORA_CONTENT_DELIVERY_URL=$LINGORA_CONTENT_DELIVERY_URL" CODE_SIGNING_ALLOWED=NO build
          app="$RUNNER_TEMP/DerivedData/Build/Products/Debug-iphonesimulator/$APP_PRODUCT"
          echo "APP_BUNDLE=$app" >> "$GITHUB_ENV"
          ditto -c -k --sequesterRsrc --keepParent "$app" "$RUNNER_TEMP/ios-simulator.zip"
      - name: Verify packaged namespace resources
        uses: hzh137940556/lingora-iOS-sdk/.github/actions/ios-translations@REPLACE_WITH_REVIEWED_COMMIT_SHA
        with:
          config: ${{ env.LINGORA_CONFIG }}
          resources: ${{ env.LINGORA_RESOURCES }}
          check-only: 'true'
          app-bundle: ${{ env.APP_BUNDLE }}
      - uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-${{ github.sha }}
          path: ${{ runner.temp }}/ios-simulator.zip
          if-no-files-found: error
          retention-days: 7
