name: Lingora iOS translations
description: Sync Apple resources through pinned CLI or verify their Bundle mapping.
inputs:
  config:
    description: Lingora CLI JSON path in the consumer repository
    required: true
  resources:
    description: Namespace to generated output and Bundle mapping JSON
    required: true
  version-file:
    description: File containing the exact public CLI version
    default: lingora-cli.version
  check-only:
    description: Verify resources without calling CLI or writing remotely
    default: 'false'
  app-bundle:
    description: Built App path for check-only verification
    default: ''
runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@v6
      if: inputs.check-only != 'true'
      env:
        LINGORA_API_KEY: ''
    - name: Sync or check configured namespaces
      shell: bash
      env:
        TOOL_ROOT: ${{ github.action_path }}/../../../Demo/scripts
        CONFIG: ${{ inputs.config }}
        RESOURCES: ${{ inputs.resources }}
        VERSION_FILE: ${{ inputs.version-file }}
        CHECK_ONLY: ${{ inputs.check-only }}
        APP_BUNDLE: ${{ inputs.app-bundle }}
      run: |
        set -euo pipefail
        args=(--config "$CONFIG" --resources "$RESOURCES" --version-file "$VERSION_FILE")
        if [[ "$CHECK_ONLY" == true ]]; then
          args+=(--check-only)
          if [[ -n "$APP_BUNDLE" ]]; then args+=(--app-bundle "$APP_BUNDLE"); fi
        elif [[ "$CHECK_ONLY" == false ]]; then
          : "${LINGORA_API_KEY:?Missing LINGORA_API_KEY}"
          [[ -z "$APP_BUNDLE" ]] || { echo 'app-bundle requires check-only'; exit 1; }
        else
          echo 'check-only must be true or false'; exit 1
        fi
        python3 "$TOOL_ROOT/sync_translations.py" "${args[@]}"
