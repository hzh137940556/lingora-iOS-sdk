name: iOS SDK CI and Release
run-name: >-
  ${{ github.event_name == 'workflow_dispatch'
      && format('Publish iOS SDK [{0}] — {1}', inputs.channel, inputs.version)
      || format('iOS SDK CI — {0}', github.head_ref || github.ref_name) }}

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:
    inputs:
      channel:
        description: 发布渠道；dev 只能来自 develop，release 只能来自 main
        required: true
        type: choice
        options: [dev, release]
      version:
        description: dev 使用 X.Y.Z-dev.N，release 使用 X.Y.Z
        required: true
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

jobs:
  verify:
    name: iOS SDK CI
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.release.outputs.version }}
      channel: ${{ steps.release.outputs.channel }}
      environment: ${{ steps.release.outputs.environment }}
      sha: ${{ steps.release.outputs.sha }}
      tag: ${{ steps.release.outputs.tag }}
      branch: ${{ steps.release.outputs.branch }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release source and approval configuration
        if: github.event_name == 'workflow_dispatch'
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_CHANNEL: ${{ inputs.channel }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_REF_TYPE: ${{ github.ref_type }}
          RELEASE_REF_NAME: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
        run: >-
          python3 scripts/sdk_release.py verify-request
          --channel "$RELEASE_CHANNEL"
          --version "$RELEASE_VERSION"
          --ref-type "$RELEASE_REF_TYPE"
          --ref-name "$RELEASE_REF_NAME"
          --expected-sha "$RELEASE_SHA"
          --repository "$GITHUB_REPOSITORY"
          --github-output "$GITHUB_OUTPUT"

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'

      - name: Verify SDK, release rules and Demo
        run: make verify

      - name: Check diff whitespace
        run: git diff --check

  publish:
    name: >-
      ${{ needs.verify.outputs.channel
          && format('Publish iOS SDK [{0}] — {1}', needs.verify.outputs.channel, needs.verify.outputs.version)
          || 'Publish iOS SDK (dispatch only)' }}
    needs: verify
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    timeout-minutes: 10
    environment:
      name: ${{ needs.verify.outputs.environment }}
    permissions:
      contents: write
      actions: read
    concurrency:
      group: ios-sdk-publish-${{ needs.verify.outputs.tag }}
      cancel-in-progress: false
    env:
      SDK_VERSION: ${{ needs.verify.outputs.version }}
      SDK_CHANNEL: ${{ needs.verify.outputs.channel }}
      RELEASE_SHA: ${{ needs.verify.outputs.sha }}
      TAG_NAME: ${{ needs.verify.outputs.tag }}
      RELEASE_REF_TYPE: ${{ github.ref_type }}
      RELEASE_REF_NAME: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout verified commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.sha }}
          fetch-depth: 0

      - name: Recheck approved release
        run: >-
          python3 scripts/sdk_release.py verify-request
          --channel "$SDK_CHANNEL"
          --version "$SDK_VERSION"
          --ref-type "$RELEASE_REF_TYPE"
          --ref-name "$RELEASE_REF_NAME"
          --expected-sha "$RELEASE_SHA"
          --repository "$GITHUB_REPOSITORY"
          --allow-existing-tag

      - name: Create immutable SwiftPM version and GitHub Release
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 scripts/sdk_release.py create-package-tag \
            --channel "$SDK_CHANNEL" \
            --version "$SDK_VERSION" \
            --source-sha "$RELEASE_SHA"
          git push origin "refs/tags/$TAG_NAME"
          PACKAGE_SHA="$(git rev-parse "refs/tags/$TAG_NAME^{commit}")"

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            printf 'GitHub Release %s 已存在，无需重复创建。\n' "$TAG_NAME"
          else
            release_args=(
              "$TAG_NAME"
              --verify-tag
              --title "Lingora iOS SDK $SDK_VERSION"
              --generate-notes
            )
            if [[ "$SDK_CHANNEL" == 'dev' ]]; then
              release_args+=(--prerelease)
            fi
            gh release create "${release_args[@]}"
          fi

          {
            printf '## ✅ Swift Package 版本已发布\n\n'
            printf -- '- 渠道：`%s`\n' "$SDK_CHANNEL"
            printf -- '- 版本/Tag：`%s`\n' "$TAG_NAME"
            printf -- '- Source SHA：`%s`\n' "$RELEASE_SHA"
            printf -- '- Package snapshot SHA：`%s`\n' "$PACKAGE_SHA"
            printf -- '- Package URL：`https://github.com/%s.git`\n' "$GITHUB_REPOSITORY"
          } >> "$GITHUB_STEP_SUMMARY"

  consume-published-package:
    name: Verify published Swift Package
    needs: [verify, publish]
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
    uses: ./.github/workflows/ios-demo-smoke.yml
    with:
      version: ${{ needs.verify.outputs.version }}
      source_sha: ${{ needs.verify.outputs.sha }}
