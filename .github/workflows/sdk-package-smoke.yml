# 独立验收已发布的 SDK，不检出 Demo 或本地 SDK 源码。
name: Published Swift Package verification
on:
  workflow_dispatch:
    inputs:
      channel:
        type: choice
        options: [dev, release]
        required: true
      version:
        description: Exact X.Y.Z or X.Y.Z-dev.N
        type: string
        required: true
      source_sha:
        description: Full source SHA containing the verification script
        type: string
        required: true
  workflow_call:
    inputs:
      channel:
        type: string
        required: true
      version:
        type: string
        required: true
      source_sha:
        type: string
        required: true
permissions:
  contents: read
jobs:
  consume:
    runs-on: macos-15
    timeout-minutes: 20
    env:
      SDK_CHANNEL: ${{ inputs.channel }}
      SDK_VERSION: ${{ inputs.version }}
      SOURCE_SHA: ${{ inputs.source_sha }}
    steps:
      - name: Validate source SHA
        shell: bash
        run: '[[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]'
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          sparse-checkout: scripts
          persist-credentials: false
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'
      - name: Verify published SDK without local source or Demo
        shell: bash
        run: |
          set -euo pipefail
          test ! -d SDK
          test ! -d Demo
          python3 scripts/verify_sdk_package.py --channel "$SDK_CHANNEL" --version "$SDK_VERSION" \
            --repository "https://github.com/$GITHUB_REPOSITORY.git"
          printf 'Verified published SDK %s: isolated SwiftPM consumer, macOS and iOS Simulator.\n' "$SDK_VERSION" >> "$GITHUB_STEP_SUMMARY"
