# 真实翻译同步在管理员配置启用后执行，普通 PR 不运行。
name: iOS Demo translations and build
on:
  push:
    branches: [develop]
    paths: ['Demo/**', '.github/workflows/ios-demo-translations.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lingora-ios-demo-develop
  cancel-in-progress: false
defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}
jobs:
  sync:
    if: github.ref == 'refs/heads/develop' && vars.LINGORA_TRANSLATIONS_ENABLED == 'true'
    runs-on: macos-15
    timeout-minutes: 30
    env:
      SDK_VERSION: ${{ vars.LINGORA_IOS_SDK_VERSION }}
      LINGORA_CONTENT_DELIVERY_URL: ${{ vars.LINGORA_CONTENT_DELIVERY_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: Demo
          persist-credentials: false
      - name: Check configuration before remote writes
        env:
          LINGORA_API_KEY: ${{ secrets.LINGORA_API_KEY }}
        run: |
          : "${LINGORA_API_KEY:?Missing LINGORA_API_KEY}"
          [[ -n "${LINGORA_CONTENT_DELIVERY_URL//[[:space:]]/}" ]]
          [[ "$SDK_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-dev\.(0|[1-9][0-9]*)$ ]]
          test ! -d SDK
          python3 Demo/scripts/configure_sdk.py --mode dev --version "$SDK_VERSION"
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'
      - name: Resolve SDK and validate build inputs before remote writes
        run: python3 Demo/scripts/build_demo.py --resolve-only
      - uses: astral-sh/setup-uv@v6
      - name: Check pinned CLI
        working-directory: Demo
        run: |
          version="$(tr -d '\r\n' < lingora-cli.version)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(rc[0-9]+)?$ ]]
          uvx --from "lingora-cli==$version" lingora --version
      - name: Reject outdated source before writing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest_sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/develop" --jq .sha)"
          [[ "$latest_sha" == "$GITHUB_SHA" ]] || { echo 'Outdated source; run the latest develop commit.'; exit 1; }
      - name: Validate, push, pull and check both namespaces
        working-directory: Demo
        env:
          LINGORA_API_KEY: ${{ secrets.LINGORA_API_KEY }}
        run: make mock_ci
      - name: Build published SDK and verify bundled resources
        run: |
          python3 Demo/scripts/build_demo.py \
            --check-resources --artifact "$RUNNER_TEMP/LingoraDemo.app"
          ditto -c -k --sequesterRsrc --keepParent "$RUNNER_TEMP/LingoraDemo.app" "$RUNNER_TEMP/LingoraDemo-simulator.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: LingoraDemo-simulator-${{ github.sha }}
          path: ${{ runner.temp }}/LingoraDemo-simulator.zip
          if-no-files-found: error
          retention-days: 7
